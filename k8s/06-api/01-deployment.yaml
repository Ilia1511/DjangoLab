apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: wp-labs
  labels:
    app: api
    component: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        component: backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: wp-labs/api:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "runserver", "0.0.0.0:4200", "--noreload"]
          ports:
            - name: http
              containerPort: 4200
              protocol: TCP
          env:
            - name: START_RABBITMQ_CONSUMER
              value: "true"
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          startupProbe:
            httpGet:
              path: /health/live
              port: http
              scheme: HTTP
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              scheme: HTTP
              httpHeaders:
                - name: X-Kube-Probe
                  value: "true"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              scheme: HTTP
              httpHeaders:
                - name: X-Kube-Probe
                  value: "true"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi
        - name: logs
          emptyDir:
            sizeLimit: 200Mi
